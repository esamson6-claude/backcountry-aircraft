name: Daily listings refresh

on:
  schedule:
    # 06:17 UTC daily. Deliberately off-peak and off-the-hour: GitHub runs
    # scheduled workflows on a best-effort queue, and the old '0 13' slot —
    # top of the hour, inside US working hours — was starting 2.5 to 5 hours
    # late every day (measured over 8 runs: +161 to +299 minutes), so the
    # "9 AM ET" it promised actually landed closer to midday.
    #
    # 06:17 UTC is ~2:17 AM ET. Even if the queue still delays it by the old
    # worst case, the refresh finishes before morning in the US.
    - cron: '17 6 * * *'
  workflow_dispatch: {}  # allow manual triggering from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Python dependencies
        run: |
          ~/.local/bin/uv venv
          ~/.local/bin/uv pip install -r requirements.txt

      - name: Run scraper
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Enables image_filter.py (hides person-photo listings). If unset, that
          # step no-ops and the rest of the pipeline runs normally.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .venv/bin/python scrape.py

      - name: Commit and push if there are changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            # Rebase before pushing. A run takes over an hour, and any push to
            # main during that window made this step fail and threw the whole
            # scrape away — 91 minutes of work and the ScrapingBee spend with
            # it. Data and docs are regenerated wholesale each run, so keeping
            # this run's version on conflict is correct.
            #
            # -X theirs, NOT -X ours: during a rebase the sides are inverted.
            # "ours" is the upstream being replayed onto, "theirs" is the commit
            # being replayed — i.e. this run's data. -X ours would throw away
            # the very scrape this step exists to publish.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              echo "push attempt $attempt failed; retrying"
              sleep 10
            done
            echo "::error::could not push after 3 attempts"
            exit 1
          fi
